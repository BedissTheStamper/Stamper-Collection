
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stamper Collection</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #263445;
    }
    header {
      background: #174a79;
      color: white;
      padding: 32px 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    main {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 20px;
    }
    .panel {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 3px 12px #00000012;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5df;
      border-radius: 8px;
      font-size: 16px;
    }
    .item {
      padding: 15px 0;
      border-bottom: 1px solid #e5e9ef;
    }
    .item:last-child { border-bottom: 0; }
    .item strong { display: block; margin-bottom: 5px; }
    .item span { color: #64748b; }
  </style>
</head>
<body>
  <header>
    <h1>STAMPER COLLECTION</h1>
    <p>Digitální katalog turistických razítek</p>
  </header>

  <main>
    <div class="panel">
      <h2>Moje sbírka razítek</h2>
      <input id="search" type="search"
             placeholder="Hledat místo nebo stát...">
      <div id="collection"></div>
    </div>
  </main>

  <script>
    const stamps = [
      { id: 1, place: "Hrad Loket", country: "Česko" },
      { id: 2, place: "Jedovnice", country: "Česko" },
      { id: 3, place: "Budapešť", country: "Maďarsko" }
    ];

    const collection = document.getElementById("collection");
    const search = document.getElementById("search");

    function render() {
      const query = search.value.toLocaleLowerCase("cs");
      collection.replaceChildren();

      const results = stamps.filter(stamp =>
        (stamp.place + " " + stamp.country)
          .toLocaleLowerCase("cs").includes(query)
      );

      for (const stamp of results) {
        const item = document.createElement("div");
        item.className = "item";

        const title = document.createElement("strong");
        title.textContent = stamp.place;

        const details = document.createElement("span");
        details.textContent =
          "ID: " + stamp.id + " | " + stamp.country;

        item.append(title, details);
        collection.append(item);
      }
    }
